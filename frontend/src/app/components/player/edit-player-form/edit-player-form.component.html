<form [formGroup]="frm" (ngSubmit)="onSubmit()" class="max-w-lg space-y-6">
    <z-form-field>
        <label z-form-label zRequired>Nombre</label>
        <z-form-control
            [errorMessage]="getControl('long_name')?.touched && isFieldInvalid('long_name') ? getErrorMessage('long_name') : ''">
            <input z-input type="text" placeholder="Ej: Enzo Perez" formControlName="long_name"
                [zStatus]="getControl('long_name')?.invalid && getControl('long_name')?.touched ? 'error' : undefined" />
        </z-form-control>
    </z-form-field>
    <div class="grid grid-cols-2 gap-4">
        <z-form-field>
            <label z-form-label zRequired>Version</label>
            <z-form-control
                [errorMessage]="getControl('fifa_version')?.touched && isFieldInvalid('fifa_version') ? getErrorMessage('fifa_version') : ''">
                <input z-input type="text" placeholder="Ej: 22" formControlName="fifa_version"
                    [zStatus]="getControl('fifa_version')?.invalid && getControl('fifa_version')?.touched ? 'error' : undefined" />
            </z-form-control>
        </z-form-field>
        <z-form-field>
            <label z-form-label zRequired>Parche</label>
            <z-form-control
                [errorMessage]="getControl('fifa_update')?.touched && isFieldInvalid('fifa_update') ? getErrorMessage('fifa_update') : ''">
                <input z-input type="text" placeholder="Ej: 3" formControlName="fifa_update"
                    [zStatus]="getControl('fifa_update')?.invalid && getControl('fifa_update')?.touched ? 'error' : undefined" />
            </z-form-control>
        </z-form-field>
    </div>
    <div class="flex items-start gap-4">
        <z-form-field class="w-1/3">
            <label z-form-label zRequired>Edad</label>
            <z-form-control
                [errorMessage]="getControl('age')?.touched && isFieldInvalid('age') ? getErrorMessage('age') : ''">
                <input z-input type="number" placeholder="Ej: 25" formControlName="age"
                    [zStatus]="getControl('age')?.invalid && getControl('age')?.touched ? 'error' : undefined" />
            </z-form-control>
        </z-form-field>
        <z-form-field class="w-2/3">
            <label z-form-label zRequired>Imagen <label class="text-muted-foreground">(url)</label></label>
            <z-form-control
                [errorMessage]="getControl('player_face_url')?.touched && isFieldInvalid('player_face_url') ? getErrorMessage('player_face_url') : ''">
                <input z-input type="text"
                    placeholder="Ej: https://img.a.transfermarkt.technology/portrait/big/56066-1625771376.png?lm=1"
                    formControlName="player_face_url"
                    [zStatus]="getControl('player_face_url')?.invalid && getControl('player_face_url')?.touched ? 'error' : undefined" />
            </z-form-control>
        </z-form-field>
    </div>
    <div class="flex items-start gap-4">
        <z-form-field class="w-1/2">
            <label z-form-label zRequired>General</label>
            <z-form-control
                [errorMessage]="getControl('overall')?.touched && isFieldInvalid('overall') ? getErrorMessage('overall') : ''">
                <input z-input type="number" placeholder="Ej: 77" formControlName="overall"
                    [zStatus]="getControl('overall')?.invalid && getControl('overall')?.touched ? 'error' : undefined" />
            </z-form-control>
        </z-form-field>
        <z-form-field class="w-1/2">
            <label z-form-label zRequired>Potencial</label>
            <z-form-control
                [errorMessage]="getControl('potential')?.touched && isFieldInvalid('potential') ? getErrorMessage('potential') : ''">
                <input z-input type="number" placeholder="Ej: 76" formControlName="potential"
                    [zStatus]="getControl('potential')?.invalid && getControl('potential')?.touched ? 'error' : undefined" />
            </z-form-control>
        </z-form-field>
    </div>
    <section class="space-y-3">
        <z-form-field>
            <label z-form-label zRequired>Posiciones</label>
            <z-form-control
                [errorMessage]="getControl('player_positions')?.touched && isFieldInvalid('player_positions') ? 'El campo es obligatorio' : ''">
                <div class="flex flex-wrap gap-2">
                    @for (position of positions; track position.value) {
                        <z-checkbox (checkChange)="togglePosition(position.value)" d-checkbox [zSize]="'lg'" />
                        <label z-form-label class="mb-0">{{position.label}}</label>
                    }
                </div>
            </z-form-control>
        </z-form-field>
    </section>
    <div class="flex items-start gap-4">
        <z-form-field class="w-1/3">
            <label z-form-label>Pierna hábil (opcional)</label>
            <z-form-control [errorMessage]="getControl('preferred_foot')?.touched && isFieldInvalid('preferred_foot') ? 'Por favor, elija una opción' : ''">
                <z-select formControlName="preferred_foot" placeholder="Elija una opción">
                    <z-select-item z-select-item zValue="Right">Derecha</z-select-item>
                    <z-select-item z-select-item zValue="Left">Izquierda</z-select-item>
                </z-select>
            </z-form-control>
        </z-form-field>
        <z-form-field class="w-2/3">
            <label z-form-label>Nacionalidad (opcional)</label>
            <z-form-control
                [errorMessage]="getControl('nationality_name')?.touched && isFieldInvalid('nationality_name') ? getErrorMessage('nationality_name') : ''">
                <input z-input type="text" placeholder="Ej: Argentina" formControlName="nationality_name"
                    [zStatus]="getControl('nationality_name')?.invalid && getControl('nationality_name')?.touched ? 'error' : undefined" />
            </z-form-control>
        </z-form-field>
    </div>
    <z-form-field>
        <label z-form-label>Club (opcional)</label>
        <z-form-control
            [errorMessage]="getControl('club_name')?.touched && isFieldInvalid('club_name') ? getErrorMessage('club_name') : ''">
            <input z-input type="text" placeholder="Ej: River Plate" formControlName="club_name"
                [zStatus]="getControl('club_name')?.invalid && getControl('club_name')?.touched ? 'error' : undefined" />
        </z-form-control>
    </z-form-field>

    <section class="space-y-3">
        <h3 class="text-sm font-semibold tracking-wide">
            Habilidades (opcional)
        </h3>

        <div class="grid grid-cols-2 md:grid-cols-3 gap-4">

            <div class="flex items-start gap-4">
                <z-form-field>
                    <label z-form-label zRequired>Ritmo</label>
                    <z-form-control zreq
                        [errorMessage]="getControl('pace')?.touched && isFieldInvalid('pace') ? getErrorMessage('pace') : ''">
                        <input z-input type="number" placeholder="Ej: 70" formControlName="pace"
                            [zStatus]="getControl('pace')?.invalid && getControl('pace')?.touched ? 'error' : undefined" />
                    </z-form-control>
                </z-form-field>
                <z-form-field>
                    <label z-form-label>Disparo</label>
                    <z-form-control
                        [errorMessage]="getControl('shooting')?.touched && isFieldInvalid('shooting') ? getErrorMessage('shooting') : ''">
                        <input z-input type="number" placeholder="Ej: 65" formControlName="shooting"
                            [zStatus]="getControl('shooting')?.invalid && getControl('shooting')?.touched ? 'error' : undefined" />
                    </z-form-control>
                </z-form-field>
            </div>
            <div class="flex items-start gap-4">
                <z-form-field>
                    <label z-form-label>Pase</label>
                    <z-form-control
                        [errorMessage]="getControl('pace')?.touched && isFieldInvalid('pace') ? getErrorMessage('pace') : ''">
                        <input z-input type="number" placeholder="Ej: 78" formControlName="pace"
                            [zStatus]="getControl('pace')?.invalid && getControl('pace')?.touched ? 'error' : undefined" />
                    </z-form-control>
                </z-form-field>
                <z-form-field>
                    <label z-form-label>Regate</label>
                    <z-form-control
                        [errorMessage]="getControl('dribbling')?.touched && isFieldInvalid('dribbling') ? getErrorMessage('dribbling') : ''">
                        <input z-input type="number" placeholder="Ej: 50" formControlName="dribbling"
                            [zStatus]="getControl('dribbling')?.invalid && getControl('dribbling')?.touched ? 'error' : undefined" />
                    </z-form-control>
                </z-form-field>
            </div>
            <div class="flex items-start gap-4">
                <z-form-field>
                    <label z-form-label>Defensa</label>
                    <z-form-control
                        [errorMessage]="getControl('defending')?.touched && isFieldInvalid('defending') ? getErrorMessage('defending') : ''">
                        <input z-input type="number" placeholder="Ej: 52" formControlName="defending"
                            [zStatus]="getControl('defending')?.invalid && getControl('defending')?.touched ? 'error' : undefined" />
                    </z-form-control>
                </z-form-field>
                <z-form-field>
                    <label z-form-label>Físico</label>
                    <z-form-control
                        [errorMessage]="getControl('physic')?.touched && isFieldInvalid('physic') ? getErrorMessage('physic') : ''">
                        <input z-input type="number" placeholder="Ej: 75" formControlName="physic"
                            [zStatus]="getControl('physic')?.invalid && getControl('physic')?.touched ? 'error' : undefined" />
                    </z-form-control>
                </z-form-field>
            </div>
        </div>
    </section>

    <div class="flex gap-2 pt-4">
        <button z-button zType="default" class="w-full" type="submit" [zLoading]="isSubmitting()">
            Actualizar jugador
        </button>
    </div>

</form>
