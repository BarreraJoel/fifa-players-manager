<header class="w-full bg-neutral-700">
    <div class="mx-auto flex h-16 max-w-7xl items-center justify-between px-6">

        <div class="flex items-center gap-6 text-white">
            <span class="text-lg font-semibol tracking-tight">
                FIFA
            </span>

            <nav class="hidden md:flex items-center gap-4 text-sm text-white">
                @for (item of mainMenuItems; track item.label) {
                    <button type="button" z-button zType="ghost" zPosition="right" [routerLink]="item.route" (click)="redirect(item.route)">
                        <z-icon [zType]="item.icon" class="mr-2" />
                        <span>{{ item.label }}</span>
                    </button>
                }
            </nav>
        </div>

        <div class="flex items-center gap-3">
            <button z-button zType="default" zSize="lg" [zLoading]="isClosing()" type="button" (click)="logout()">
                Cerrar sesión
            </button>
        </div>

    </div>
</header>
