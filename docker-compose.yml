services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: fifa_manager_backend
    ports:
      - "3000:3000"
    depends_on:
      db:
        condition: service_healthy
    env_file:
      - .env
    volumes:
      - ./backend:/usr/src/app

  frontend:
      build:
        context: ./frontend
        dockerfile: Dockerfile
      container_name: fifa_manager_frontend
      ports:
        - "4200:4200"
      volumes:
        - ./frontend:/usr/src/app
        - /usr/src/app/node_modules
      depends_on:
        - backend

  db:
    image: mysql:8.0
    container_name: fifa_manager_mysql
    environment:
      MYSQL_ALLOW_EMPTY_PASSWORD: true
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD}
      MYSQL_DATABASE: ${DB_NAME}
    volumes:
      - mysql_data:/var/lib/mysql
      - ./db/init.sql:/docker-entrypoint-initdb.d/init.sql
    ports:
      - "3306:3306"
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  mysql_data:
